name: Security checks
on:
  push:
    branches: [agent/security-hardening-2026-11-22]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Refresh lockfile in hardening branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/security-hardening-2026-11-22'
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'chore: regenerate lockfile after security updates'
            git push
          fi
      - name: Confirm committed lockfile
        if: github.event_name == 'pull_request'
        run: |
          npm install --package-lock-only --ignore-scripts
          git diff --exit-code -- package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Syntax check
        run: find src tests scripts -name '*.js' -print0 | xargs -0 -n 1 node --check
      - name: Unit tests
        run: npm test
      - name: Audit high and critical
        run: npm audit --omit=dev --audit-level=high
