name: Knowledge integration
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: coinpsi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d coinpsi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: node --test tests/knowledge-integration.test.js
        env:
          KNOWLEDGE_INTEGRATION: '1'
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/coinpsi_test
          DATABASE_SSL: 'false'
